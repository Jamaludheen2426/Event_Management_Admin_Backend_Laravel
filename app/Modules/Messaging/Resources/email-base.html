<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{app_name}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      line-height: 1.6;
    }
    .wrapper {
      width: 100%;
      padding: 40px 20px;
      background-color: #f3f4f6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    .header {
      background-color: #2563eb;
      padding: 30px 40px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
    }
    .content {
      padding: 40px;
    }
    .content p {
      margin: 0 0 16px;
      font-size: 16px;
    }
    .content h2 {
      margin: 0 0 20px;
      font-size: 20px;
      color: #1f2937;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 16px;
      margin: 20px 0;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .otp-code {
      display: inline-block;
      padding: 15px 30px;
      background-color: #f3f4f6;
      border: 2px dashed #2563eb;
      border-radius: 8px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #2563eb;
      margin: 20px 0;
    }
    .footer {
      background-color: #f9fafb;
      padding: 30px 40px;
      text-align: center;
      border-top: 1px solid #e5e7eb;
    }
    .footer p {
      margin: 0 0 8px;
      font-size: 14px;
      color: #6b7280;
    }
    .footer a {
      color: #2563eb;
      text-decoration: none;
    }
    .divider {
      border: 0;
      border-top: 1px solid #e5e7eb;
      margin: 20px 0;
    }
    .text-muted {
      color: #6b7280;
      font-size: 14px;
    }
    .text-center {
      text-align: center;
    }
    @media only screen and (max-width: 600px) {
      .wrapper {
        padding: 20px 10px;
      }
      .content, .header, .footer {
        padding: 25px 20px;
      }
      .otp-code {
        font-size: 24px;
        letter-spacing: 5px;
        padding: 12px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <table class="container" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td class="header">
          <h1>{{app_name}}</h1>
        </td>
      </tr>
      <tr>
        <td class="content">
          @@CONTENT@@
        </td>
      </tr>
      
      <tr>
        <td class="footer">
          <p>&copy; {{current_year}} {{app_name}}. All rights reserved.</p>
          <p><a href="{{app_url}}">{{app_url}}</a></p>
        </td>
      </tr>
      
    </table>
  </div>
</body>
</html>
